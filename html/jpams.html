<!doctype html>
<!--
The DOCTYPE declaration above will set the browser's rendering engine into
"Standards Mode". Replacing this declaration with a "Quirks Mode" doctype may
lead to some differences in layout.
-->
<html>
    <head>
        <!--<meta name='gwt:module' content='com.edgear.Main=com.edgear.Main'>-->
        <meta name="gwt:onLoadErrorFn" content="onGwtModuleLoadError"/>
        <script type="text/javascript">
            function onGwtModuleLoadError(message) {
               alert("error loading:" + message + "<hr>"+navigator.userAgent );
            }
        </script>

        <script src="https://www.wiris.net/demo/editor/editor"></script>
        <script type="text/javascript">
            console.log("Script is declared in progress.html");
            var math_editor;
            var chem_editor;
            const math_editor_properties = {
                'language': 'en', 
                'toolbar':'<toolbar ref="general">\n\
                            <tab ref="general" rows="3">\n\
                                <removeItem ref="autoDisplayBevelledFraction" />\n\
                                <empty after="autoDisplayFraction"/>\n\
                            </tab>\n\
                           </toolbar>', 
                'fontSize': '16px', 
                'display': 'inline'
            }
            const chem_editor_properties = {
                'language': 'en', 
                'toolbar':'chemistry', 
                'fontSize': '16px', 
                'display': 'inline'
            }
            
            window.onload = function () {
              console.log("onload function called in progress.html");
              math_editor = com.wiris.jsEditor.JsEditor.newInstance(math_editor_properties);
              chem_editor = com.wiris.jsEditor.JsEditor.newInstance(chem_editor_properties);  
            }
        </script> 
        
        <meta name="apple-mobile-web-app-capable" content="yes" >
        <meta name="apple-mobile-web-app-status-bar-style" content="black" >
        <meta name="viewport" id="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,initial-scale=1.0" >
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <link rel="stylesheet" type="text/css" href="./default-theme.css" />
        <title>Student Progress Center</title>
        <style>
            #loading {
                position: absolute;
                left: 45%;
                top: 40%;
                padding: 2px;
                z-index: 20001;
                height: auto;
                width: 200;
            }

            #loading a {
                color: #225588;
            }

            #loading .loadingIndicator {
                background: white;
                font: bold 13px tahoma, arial, helvetica;
                padding: 10px;
                margin: 0;
                height: auto;
                color: #444;
            }

            #loadingMsg {
                font: bold 18px arial, tahoma, sans-serif;
                text-align: center;
            }
        </style>
    </head>
    
    <body>
        
        <div id="loadingWrapper">
            <div id="loading">
                <div class="loadingIndicator">
                    <img src="images/loading.gif" width="100" height="100" style="margin-right:8px;float:left;vertical-align:top;"/><br>
                    <span id="loadingMsg">Loading SPC...</span>
                </div>
            </div>
        </div>
        
        <script type="text/javascript" >
            var dev = Math.floor(Math.random() * 100);
            document.write('<script type="text/javascript" src="com.edgear.Main/com.edgear.Main.nocache.js?dev=' + dev + '"\><\/script>');
        </script>
        
        <script type="text/javascript">document.getElementById("loadingWrapper").style.display="none"; </script>
        <script type="text/javascript">document.getElementById("loadingWrapper").parentNode.removeChild(document.getElementById("loadingWrapper")); </script>
    </body>
</html>
